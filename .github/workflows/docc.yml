name: DocC

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Test and validate documentation
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Report Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release library as consumers receive it
        run: swift build -c release

      - name: Run release tests
        run: swift test -c release -Xswiftc -DATC_TEST_HOOKS

      - name: Compile UIKit integration
        run: |
          xcodebuild \
            -scheme AutoTableCharts \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/autotablecharts-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Generate static DocC archive
        env:
          DOCC_OUTPUT: ${{ runner.temp }}/autotablecharts-docc
        run: |
          swift package \
            --allow-writing-to-directory "$DOCC_OUTPUT" \
            generate-documentation \
            --target AutoTableCharts \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path AutoTableCharts \
            --output-path "$DOCC_OUTPUT" \
            --analyze \
            --warnings-as-errors \
            --experimental-documentation-coverage \
            --coverage-summary-level detailed \
            --source-service github \
            --source-service-base-url "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}" \
            --checkout-path "$GITHUB_WORKSPACE"

      - name: Verify static archive
        env:
          DOCC_OUTPUT: ${{ runner.temp }}/autotablecharts-docc
        run: |
          test -f "$DOCC_OUTPUT/index.html"
          test -f "$DOCC_OUTPUT/metadata.json"
          test -f "$DOCC_OUTPUT/documentation-coverage.json"
          test -f "$DOCC_OUTPUT/documentation/autotablecharts/index.html"
          test -f "$DOCC_OUTPUT/data/documentation/autotablecharts.json"
          grep -F 'var baseUrl = "/AutoTableCharts/"' "$DOCC_OUTPUT/index.html" >/dev/null

      - name: Add GitHub Pages landing redirect
        env:
          DOCC_OUTPUT: ${{ runner.temp }}/autotablecharts-docc
        run: |
          cp .github/pages-root-redirect.html "$DOCC_OUTPUT/index.html"
          grep -F './documentation/autotablecharts/' "$DOCC_OUTPUT/index.html" >/dev/null
          grep -F 'window.location.search + window.location.hash' "$DOCC_OUTPUT/index.html" >/dev/null
          if grep -F '<meta http-equiv="refresh"' "$DOCC_OUTPUT/index.html" >/dev/null; then
            echo "Unexpected meta refresh in GitHub Pages landing page" >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/autotablecharts-docc

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
