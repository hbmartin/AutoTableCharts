name: DocC

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Test and build documentation
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Report Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Generate static DocC archive
        env:
          DOCC_OUTPUT: ${{ runner.temp }}/autotablecharts-docc
        run: |
          swift package \
            --allow-writing-to-directory "$DOCC_OUTPUT" \
            generate-documentation \
            --target AutoTableCharts \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path AutoTableCharts \
            --output-path "$DOCC_OUTPUT" \
            --analyze \
            --warnings-as-errors \
            --experimental-documentation-coverage \
            --coverage-summary-level detailed \
            --source-service github \
            --source-service-base-url "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}" \
            --checkout-path "$GITHUB_WORKSPACE"

      - name: Verify static archive
        env:
          DOCC_OUTPUT: ${{ runner.temp }}/autotablecharts-docc
        run: |
          test -f "$DOCC_OUTPUT/index.html"
          test -f "$DOCC_OUTPUT/metadata.json"
          test -f "$DOCC_OUTPUT/documentation-coverage.json"
          test -f "$DOCC_OUTPUT/documentation/autotablecharts/index.html"
          test -f "$DOCC_OUTPUT/data/documentation/autotablecharts.json"
          grep -F 'var baseUrl = "/AutoTableCharts/"' "$DOCC_OUTPUT/index.html" >/dev/null

      - name: Add GitHub Pages landing redirect
        env:
          DOCC_OUTPUT: ${{ runner.temp }}/autotablecharts-docc
        run: |
          cp .github/pages-root-redirect.html "$DOCC_OUTPUT/index.html"
          grep -F './documentation/autotablecharts/' "$DOCC_OUTPUT/index.html" >/dev/null
          grep -F 'window.location.search + window.location.hash' "$DOCC_OUTPUT/index.html" >/dev/null
          if grep -F '<meta http-equiv="refresh"' "$DOCC_OUTPUT/index.html" >/dev/null; then
            echo "Unexpected meta refresh in GitHub Pages landing page" >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/autotablecharts-docc

  release_library:
    name: Audit SwiftPM release library
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify release library excludes test hooks
        run: Scripts/verify-release-library.sh

  release_tests:
    name: Release tests (${{ matrix.mode }})
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode:
          - without-hooks
          - with-hooks
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify hook-dependent release tests
        run: Scripts/verify-release-tests.sh "${{ matrix.mode }}"

  apple_platforms:
    name: ${{ matrix.name }}
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Compile iOS integration in debug
            configuration: Debug
            destination: generic/platform=iOS Simulator
            slug: ios-debug
            audit_release: false
          - name: Compile and audit iOS integration in release
            configuration: Release
            destination: generic/platform=iOS Simulator
            slug: ios-release
            audit_release: true
          - name: Compile and audit tvOS integration in release
            configuration: Release
            destination: generic/platform=tvOS Simulator
            slug: tvos-release
            audit_release: true
          - name: Compile and audit watchOS integration in release
            configuration: Release
            destination: generic/platform=watchOS Simulator
            slug: watchos-release
            audit_release: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build package integration
        env:
          ATC_CONFIGURATION: ${{ matrix.configuration }}
          ATC_DESTINATION: ${{ matrix.destination }}
          ATC_DERIVED_DATA: ${{ runner.temp }}/autotablecharts-${{ matrix.slug }}
        run: |
          xcodebuild \
            -scheme AutoTableCharts \
            -configuration "$ATC_CONFIGURATION" \
            -destination "$ATC_DESTINATION" \
            -derivedDataPath "$ATC_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Xcode release library excludes test hooks
        if: matrix.audit_release
        env:
          ATC_DERIVED_DATA: ${{ runner.temp }}/autotablecharts-${{ matrix.slug }}
        run: Scripts/verify-release-library.sh --xcode-derived-data "$ATC_DERIVED_DATA"

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - build
      - release_library
      - release_tests
      - apple_platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
